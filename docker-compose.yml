services:
  api:
    build:
      context: ./backend
      args:
        DEV: "1"  # include pytest/httpx so `make test` works in this image
    ports:
      - "8000:8000"
    volumes:
      # Mount the backend so code, data/ and saves (*.eu5 in backend/) are visible without rebuilding.
      - ./backend:/app
      # Docs and frontend sources at the same paths relative to /app as in the repo (make docs, tests).
      - ./docs:/docs
      - ./frontend/src:/frontend/src:ro

  # Frontend dev server (Vite, hot reload) on http://localhost:5173; /api is proxied to the backend.
  web:
    image: node:20-alpine
    working_dir: /web
    command: sh -c "npm install --no-fund --no-audit && npm run dev"
    environment:
      API_URL: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/web
      - /web/node_modules  # keep container-installed deps off the bind mount
    depends_on:
      - api

  # Production frontend: built SPA served by nginx on http://localhost:8080 (make web-prod-up).
  web-prod:
    profiles: [prod]
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
